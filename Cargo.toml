[package]
name = "smolkoda"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Tiny agentic coding harness with pluggable providers"
license = "MIT"
repository = "https://github.com/kyambuthia/smolkoda"
readme = "README.md"
keywords = ["agent", "coding-agent", "llm", "cli", "terminal"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ureq = { version = "2", features = ["json"] }
regex = "1"
glob = "0.3"
rpassword = "7"
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
